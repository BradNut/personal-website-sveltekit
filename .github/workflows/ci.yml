name: CI

on:
  # No paths-ignore on pull_request: these jobs are required checks (.knowledge-base/runbooks/branch-protection.md),
  # and a required check that never runs leaves a docs-only PR unmergeable.
  pull_request:
    branches: [master, development]
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.knowledge-base/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Fake values: varlock validates these at build/test time; nothing real is needed in CI.
env:
  ENVIRONMENT: test
  WALLABAG_CLIENT_ID: test-client-id
  WALLABAG_CLIENT_SECRET: test-client-secret
  WALLABAG_USERNAME: test-user
  WALLABAG_PASSWORD: test-password
  WALLABAG_URL: https://wallabag.test
  BANDCAMP_USERNAME: test-user
  PUBLIC_SITE_URL: https://example.test
  PUBLIC_URL: https://localhost:5173
  PUBLIC_SENTRY_URL: https://sentry.test
  PUBLIC_UMAMI_URL: https://umami.test/script.js
  PUBLIC_UMAMI_ID: test-umami-id
  USE_REDIS_CACHE: 'false'
  REDIS_URI: redis://localhost:6379
  SENTRY_AUTH_TOKEN: test-sentry-token
  SENTRY_BACKEND_URL: https://sentry-backend.test

jobs:
  # Biome plus the pinned actions/images guard and its tests.
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm check:pinned-refs
      - run: pnpm test:scripts

  # Fails on any high or critical production advisory. Moderates and lows stay visible in the output but
  # do not block; see .knowledge-base/runbooks/branch-protection.md.
  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high

  check:
    name: Typecheck (svelte-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Generate Varlock types
        run: pnpm exec varlock typegen
      - run: pnpm check

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_REDIS_CACHE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:unit --run

  e2e:
    name: E2E (${{ github.event_name == 'pull_request' && github.base_ref == 'development' && 'chromium' || 'all browsers' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Feature PRs into development get fast Chromium-only feedback; master gets all browsers.
      E2E_SCOPE: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' && 'chromium' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Resolve Playwright version and browsers
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          # Browser builds link against OS libraries (e.g. WebKit needs the image's ICU), so key the cache on the runner image.
          echo "image=${ImageOS:?ImageOS not set}" >> "$GITHUB_OUTPUT"
          if [ "$E2E_SCOPE" = chromium ]; then
            echo "browsers=chromium" >> "$GITHUB_OUTPUT"
            echo "project=--project=chromium" >> "$GITHUB_OUTPUT"
          else
            echo "browsers=chromium firefox webkit" >> "$GITHUB_OUTPUT"
            echo "project=" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-${{ env.E2E_SCOPE }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ steps.pw.outputs.browsers }}
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ steps.pw.outputs.browsers }}
      - name: Run tests
        run: pnpm test:integration ${{ steps.pw.outputs.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn
