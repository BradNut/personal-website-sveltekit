name: CI

on:
  pull_request:
    branches: [master, main, development]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Fake values: varlock validates these at build/test time; nothing real is needed in CI.
env:
  ENVIRONMENT: test
  WALLABAG_CLIENT_ID: test-client-id
  WALLABAG_CLIENT_SECRET: test-client-secret
  WALLABAG_USERNAME: test-user
  WALLABAG_PASSWORD: test-password
  WALLABAG_URL: https://wallabag.test
  BANDCAMP_USERNAME: test-user
  PUBLIC_SITE_URL: https://example.test
  PUBLIC_URL: https://localhost:5173
  PUBLIC_SENTRY_URL: https://sentry.test
  PUBLIC_UMAMI_URL: https://umami.test/script.js
  PUBLIC_UMAMI_ID: test-umami-id
  USE_REDIS_CACHE: 'false'
  REDIS_URI: redis://localhost:6379
  SENTRY_AUTH_TOKEN: test-sentry-token
  SENTRY_BACKEND_URL: https://sentry-backend.test

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint

  check:
    name: Typecheck (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Varlock types
        run: pnpm exec varlock typegen
      - run: pnpm check

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    env:
      USE_REDIS_CACHE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:unit --run

  e2e:
    name: E2E (${{ github.event_name == 'pull_request' && github.base_ref == 'development' && 'chromium' || 'all browsers' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Feature PRs into development get fast Chromium-only feedback; master gets all browsers.
      E2E_SCOPE: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' && 'chromium' || 'all' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve Playwright version and browsers
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          if [ "$E2E_SCOPE" = chromium ]; then
            echo "browsers=chromium" >> "$GITHUB_OUTPUT"
            echo "project=--project=chromium" >> "$GITHUB_OUTPUT"
          else
            echo "browsers=chromium firefox webkit" >> "$GITHUB_OUTPUT"
            echo "project=" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ env.E2E_SCOPE }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ steps.pw.outputs.browsers }}
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ steps.pw.outputs.browsers }}
      - name: Run tests
        run: pnpm test:integration ${{ steps.pw.outputs.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn
