name: Fallow Analysis

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Dead code, duplication & complexity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: fallow-rs/fallow@624adaf8c8ae33de863911658890890a529a46f3 # v2.67.0
        with:
          format: sarif
          comment: true
          auto-changed-since: true
          fail-on-issues: false
          production: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: fallow-results.sarif
