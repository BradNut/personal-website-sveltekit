name: Fallow Analysis

on:
  pull_request:
    branches: [master, main, development]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: fallow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Dead code, duplication & complexity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: fallow-rs/fallow@624adaf8c8ae33de863911658890890a529a46f3
        with:
          format: sarif
          comment: true
          auto-changed-since: true
          fail-on-issues: false
          production: true
      - uses: github/codeql-action/upload-sarif@5e316336eb4f107009e477d4bfbfff13d7250fae
        if: always()
        with:
          sarif_file: fallow-results.sarif
