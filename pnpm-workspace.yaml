allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  svelte-preprocess: true

overrides:
  # satori (and its @shuding/opentype.js) pin fflate 0.7.3 (GHSA advisory, fixed in 0.7.5)
  fflate: ^0.7.5

peerDependencyRules:
  allowedVersions:
    # bits-ui -> runed 0.35 declares an optional kit ^2 peer for its `runed/kit` entry, which bits-ui never imports
    runed>@sveltejs/kit: '3'
